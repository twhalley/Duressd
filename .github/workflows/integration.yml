name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-device:
    name: loop-device wipe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats cryptsetup-bin dosfstools util-linux

      - name: Integration tests (real LUKS on loop devices)
        run: sudo make integration BATS=bats
