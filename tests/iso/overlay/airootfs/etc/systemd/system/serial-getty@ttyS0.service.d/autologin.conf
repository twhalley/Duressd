# duressd test ISO — autologin root on the SERIAL console as well.
#
# The stock releng profile only autologins tty1 (the VGA console). But
# `make vm-auto` boots fully headless with `console=ttyS0 -display none`, so it
# only ever sees the serial line. Without this drop-in ttyS0 stops at a
# `archiso login:` prompt, ~/.zprofile is never sourced, duressd-selftest never
# runs, and the headless run hangs until it times out.
#
# Mirrors releng's tty1 autologin, plus --keep-baud for the serial port.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
